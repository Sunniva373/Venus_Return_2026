<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Herzensdialoge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wdth,wght@0,62.5..100,300..600;1,62.5..100,300..500&family=Pinyon+Script&family=Raleway:wght@300;400;500;600&display=swap">
<style>
:root{
  --ink:#4a3236;
  --ink-soft:#7d5f64;
  --ink-faint:#a88a8e;
  --rose:#b98892;
  --rose-deep:#94606b;
  --line:rgba(148,96,107,.22);
  --glass:rgba(255,255,255,.46);
  --glass-strong:rgba(255,255,255,.68);
  --glass-edge:rgba(255,255,255,.78);
  --cream:#fbf4f1;
  --serif:"Noto Serif",Georgia,"Times New Roman",serif;
  --script:"Pinyon Script","Snell Roundhand","Apple Chancery",cursive;
  --sans:"Raleway","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:#f1e1df}
body{
  margin:0;min-height:100vh;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;
  background:
    radial-gradient(circle at 22% 20%, rgba(255,218,216,0.46), transparent 34%),
    radial-gradient(circle at 80% 72%, rgba(196,140,150,0.18), transparent 36%),
    linear-gradient(135deg, #f8ece8 0%, #ead6d6 100%);
  background-attachment:fixed;
  padding-inline:16px;
}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 72px}
h1,h2,h3{font-family:var(--serif);font-stretch:75%;font-weight:400;text-wrap:balance;margin:0;color:var(--ink)}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rose-deep);outline-offset:3px;border-radius:6px}
.eyebrow{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);font-weight:500}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}
.brand{font-family:var(--script);font-size:clamp(1.5rem,5vw,1.9rem);text-align:left;color:var(--rose-deep);line-height:1;background:none;border:0;padding:0;cursor:pointer}
.navbtn{background:var(--glass);border:1px solid var(--glass-edge);border-radius:999px;padding:.45rem 1rem;font-size:.85rem;cursor:pointer;color:var(--ink);transition:background .2s}
.navbtn:hover{background:var(--glass-strong)}

/* ---------- hero ---------- */
.hero{text-align:left;display:grid;gap:14px;margin-bottom:10px}
.hero h1{font-size:clamp(2.3rem,7vw,3.6rem);line-height:1.02;font-weight:300}
.hero h1 em{font-style:italic;color:var(--rose-deep)}
.hero .script{font-family:var(--script);font-size:clamp(2rem,6vw,2.8rem);color:var(--rose-deep);line-height:1;margin-top:-4px}
.hero .lead{font-family:var(--serif);font-style:italic;font-size:1.2rem;color:var(--ink-soft);max-width:34ch}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.85rem;color:var(--ink-soft);margin-top:6px}
.meta span b{font-weight:600;color:var(--ink)}

/* ---------- loop ---------- */
.loop{margin:18px 0 8px;position:relative}
.loop svg{width:100%;height:auto;display:block;overflow:visible}
.loop .path{fill:none;stroke:var(--rose);stroke-width:1.2;stroke-dasharray:2 5;stroke-linecap:round;opacity:.8}
.loop .path-solid{fill:none;stroke:var(--rose-deep);stroke-width:1.4;stroke-linecap:round}
.dot{cursor:pointer}
.dot circle.m{fill:var(--cream);stroke:var(--rose);stroke-width:1.2;transition:r .25s}
.dot.open circle.m{fill:#fff;stroke:var(--rose-deep);stroke-width:1.6}
.dot.done circle.m{fill:var(--rose-deep);stroke:var(--rose-deep)}
.dot.locked{cursor:default}
.dot.locked circle.m{fill:rgba(255,255,255,.35);stroke:var(--ink-faint);stroke-dasharray:1.5 2}
.dot text{font-family:var(--sans);font-size:9px;fill:var(--ink-soft);text-anchor:middle;letter-spacing:.04em}
.dot.today circle.halo{fill:none;stroke:var(--rose-deep);stroke-width:.8;opacity:.5}
.dot:not(.locked):hover circle.m{r:8}
.loop-caption{font-size:.8rem;color:var(--ink-faint);text-align:center;font-style:italic;font-family:var(--serif)}

/* ---------- intro note ---------- */
.note{background:var(--glass);border:1px solid var(--glass-edge);border-radius:22px;padding:22px 24px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;gap:10px;margin:26px 0}
.note h2{font-size:1.35rem}
.note p{color:var(--ink-soft)}
.movement{font-family:var(--serif);font-stretch:80%;font-size:1.02rem;color:var(--rose-deep);line-height:1.8}

/* ---------- chapter list ---------- */
.list{display:grid;gap:2px;margin-top:8px}
.row{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:14px;padding:16px 6px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%;transition:background .2s}
.row:hover:not(.is-locked){background:rgba(255,255,255,.28)}
.row .date{font-family:var(--serif);font-stretch:70%;font-size:1.5rem;line-height:1;color:var(--rose-deep);font-variant-numeric:tabular-nums}
.row .date small{display:block;font-family:var(--sans);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin-top:4px}
.row .t{display:grid;gap:2px}
.row .t .k{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}
.row .t .n{font-family:var(--serif);font-stretch:85%;font-size:1.15rem;color:var(--ink)}
.row .t .e{font-size:.82rem;color:var(--ink-soft)}
.state{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;padding:.3rem .7rem;border-radius:999px;white-space:nowrap}
.state.open{background:rgba(255,255,255,.6);color:var(--rose-deep);border:1px solid rgba(148,96,107,.3)}
.state.done{background:var(--rose-deep);color:#fff}
.state.locked{color:var(--ink-faint);border:1px dashed var(--ink-faint)}
.row.is-locked{cursor:default}
.row.is-locked .n,.row.is-locked .date{opacity:.55}

/* ---------- chapter ---------- */
.ch-head{display:grid;gap:10px;margin-bottom:24px}
.ch-head h1{font-size:clamp(2rem,6.5vw,3rem);line-height:1.05;font-weight:300}
.voices{font-family:var(--serif);font-style:italic;color:var(--ink-soft);font-size:1.05rem}
.voices b{font-style:normal;font-weight:400;color:var(--rose-deep)}
.feel{font-family:var(--serif);font-size:1.25rem;line-height:1.5;font-style:italic;color:var(--ink);border-left:1px solid var(--rose);padding-left:16px;margin-top:6px;max-width:40ch}

.welcome{background:var(--glass-strong);border:1px solid var(--glass-edge);border-radius:22px;padding:22px 24px;margin-bottom:34px;display:grid;gap:8px}
.welcome .script{font-family:var(--script);font-size:1.9rem;color:var(--rose-deep);line-height:1.1}
.welcome p{color:var(--ink-soft);max-width:60ch}

.step{display:grid;grid-template-columns:40px minmax(0,1fr);gap:4px 16px;padding-bottom:34px;position:relative}
.step::before{content:"";position:absolute;left:19px;top:44px;bottom:6px;width:1px;background:var(--line)}
.step:last-of-type::before{display:none}
.step .num{width:40px;height:40px;border-radius:50%;border:1px solid var(--rose);display:grid;place-items:center;font-family:var(--serif);font-size:1rem;color:var(--rose-deep);background:rgba(255,255,255,.5)}
.step .body{display:grid;gap:12px;min-width:0;padding-top:6px}
.step h3{font-size:1.35rem;font-stretch:80%}
.step .sub{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-top:-8px}
.step p{color:var(--ink-soft);max-width:62ch}

.audio{display:flex;align-items:center;gap:14px;background:var(--glass);border:1px solid var(--glass-edge);border-radius:999px;padding:8px 18px 8px 8px}
.audio .play{width:40px;height:40px;border-radius:50%;background:var(--rose-deep);border:0;display:grid;place-items:center;flex:none;opacity:.55;cursor:not-allowed}
.audio .play svg{width:14px;height:14px;fill:#fff;margin-left:2px}
.audio .wave{flex:1;height:22px;display:flex;align-items:center;gap:3px;min-width:0;overflow:hidden}
.audio .wave i{display:block;width:2px;border-radius:2px;background:var(--rose);opacity:.5;flex:none}
.audio .lbl{font-size:.78rem;color:var(--ink-faint);white-space:nowrap}

details.astro{background:rgba(255,255,255,.3);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
details.astro summary{cursor:pointer;font-size:.85rem;color:var(--rose-deep);font-weight:500;list-style:none}
details.astro summary::-webkit-details-marker{display:none}
details.astro summary::after{content:" +";}
details.astro[open] summary::after{content:" –"}
details.astro ul{margin:10px 0 8px;padding-left:18px;color:var(--ink-soft);font-size:.92rem}
details.astro p{font-size:.92rem}
details.astro .fine{font-size:.78rem;color:var(--ink-faint);margin-top:8px;font-style:italic}

.practice{background:var(--glass);border:1px solid var(--glass-edge);border-radius:18px;padding:16px 20px;display:grid;gap:6px}
.practice .min{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--rose-deep)}
.practice p{color:var(--ink)}

.question{font-family:var(--serif);font-size:clamp(1.35rem,4vw,1.7rem);line-height:1.35;font-style:italic;color:var(--ink);max-width:30ch;font-weight:300}

.topics{display:flex;flex-wrap:wrap;gap:6px}
.topics span{font-size:.78rem;padding:.25rem .7rem;border-radius:999px;background:rgba(255,255,255,.45);color:var(--ink-soft);border:1px solid var(--glass-edge)}

.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{background:transparent;border:1px solid var(--line);border-radius:999px;padding:.4rem .95rem;font-size:.85rem;cursor:pointer;color:var(--ink-soft)}
.tab[aria-selected="true"]{background:var(--glass-strong);border-color:var(--glass-edge);color:var(--rose-deep);font-weight:500}

.prompt{font-family:var(--serif);font-style:italic;color:var(--rose-deep);font-size:1.05rem}
textarea{width:100%;min-height:140px;resize:vertical;border:1px solid var(--glass-edge);border-radius:16px;background:rgba(255,255,255,.55);padding:14px 16px;font-family:var(--serif);font-size:1.05rem;line-height:1.7;color:var(--ink)}
textarea::placeholder{color:var(--ink-faint);font-style:italic}
textarea:focus{outline:none;border-color:var(--rose);background:rgba(255,255,255,.72)}
.saved{font-size:.75rem;color:var(--ink-faint);height:1em}

.card-draw{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center}
.tcard{aspect-ratio:3/5;max-width:100%;border-radius:12px;border:1px solid var(--glass-edge);background:linear-gradient(160deg,rgba(255,255,255,.8),rgba(234,214,214,.7));display:grid;place-items:center;text-align:center;padding:10px;cursor:pointer;position:relative;box-shadow:0 10px 30px -18px rgba(120,70,80,.5);transition:transform .4s}
.tcard:hover{transform:translateY(-2px)}
.tcard .back{width:70%;height:80%;border:1px solid var(--rose);border-radius:8px;display:grid;place-items:center}
.tcard .back svg{width:34px;height:34px;stroke:var(--rose-deep);fill:none;stroke-width:1}
.tcard .face{font-family:var(--serif);font-stretch:75%;font-size:1.05rem;color:var(--rose-deep);line-height:1.2}
.tcard .face small{display:block;font-family:var(--sans);font-size:.62rem;letter-spacing:.14em;color:var(--ink-faint);margin-bottom:6px}

.letter-box{background:var(--cream);border-radius:6px;padding:22px 22px 16px;border:1px solid rgba(148,96,107,.14);box-shadow:0 18px 40px -30px rgba(120,70,80,.55);display:grid;gap:10px}
.letter-box .lp{font-family:var(--script);font-size:1.7rem;color:var(--rose-deep);line-height:1.2}
.letter-box textarea{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:4px 0;min-height:120px;background-image:repeating-linear-gradient(transparent 0 1.78rem, rgba(148,96,107,.12) 1.78rem calc(1.78rem + 1px));line-height:1.78rem}

.mantra{font-family:var(--serif);font-size:1.3rem;line-height:1.5;color:var(--rose-deep);text-align:center;padding:22px 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-style:italic}

.closing{text-align:center;display:grid;gap:10px;padding:34px 10px 10px;justify-items:center}
.closing .script{font-family:var(--script);font-size:1.8rem;color:var(--rose-deep);line-height:1.2;max-width:22ch}
.closing p{color:var(--ink-soft);max-width:44ch}
.donebtn{margin-top:12px;background:var(--rose-deep);color:#fff;border:0;border-radius:999px;padding:.8rem 1.6rem;font-size:.92rem;letter-spacing:.04em;cursor:pointer;transition:opacity .2s}
.donebtn:hover{opacity:.9}
.donebtn.is-done{background:transparent;color:var(--rose-deep);border:1px solid var(--rose)}

.pager{display:flex;justify-content:space-between;gap:10px;margin-top:40px;flex-wrap:wrap}

.group{margin-top:34px}
.group-h{display:flex;align-items:baseline;justify-content:space-between;gap:6px 14px;flex-wrap:wrap;padding-bottom:6px;border-bottom:1px solid var(--line)}
.group-h h2{font-size:1.5rem;font-stretch:80%}
.note b{font-weight:600;color:var(--ink)}
.recap{background:rgba(255,255,255,.3);border:1px solid var(--line);border-radius:22px;padding:20px 22px;margin-bottom:34px;display:grid;gap:10px}
.recap > p{color:var(--ink-soft)}
.recap ul{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:14px}
.recap li{display:grid;gap:4px;padding-left:14px;border-left:1px solid var(--rose)}
.rc-link{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-family:var(--serif);font-stretch:85%;font-size:1.08rem;color:var(--rose-deep)}
.rc-link:hover{text-decoration:underline;text-underline-offset:3px}
.rc-own{font-family:var(--serif);font-style:italic;color:var(--ink);font-size:.98rem}
.rc-empty{font-size:.88rem;color:var(--ink-faint)}

.ritual{margin:4px 0 0;padding-left:20px;display:grid;gap:6px;color:var(--ink)}
.ritual li::marker{color:var(--rose-deep);font-family:var(--serif)}
.sign-in{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:6px 0;font-family:var(--serif);font-style:italic;font-size:1.05rem;color:var(--ink)}
.sign-in:focus{outline:none;border-color:var(--rose)}
.sign-place{text-align:right;font-family:var(--serif);font-style:italic;color:var(--ink-soft);margin-top:-14px}
.letter-box + .letter-box{margin-top:4px}

/* letter page */
.full-letter{background:var(--cream);border-radius:6px;padding:clamp(24px,5vw,48px);box-shadow:0 24px 60px -40px rgba(120,70,80,.6);border:1px solid rgba(148,96,107,.14);display:grid;gap:22px}
.full-letter .salute{font-family:var(--script);font-size:2.2rem;color:var(--rose-deep);line-height:1.1}
.full-letter .part{display:grid;gap:6px}
.full-letter .part .from{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}
.full-letter .part p{font-family:var(--serif);font-size:1.1rem;line-height:1.8;white-space:pre-wrap;color:var(--ink)}
.full-letter .empty{font-family:var(--serif);font-style:italic;color:var(--ink-faint)}
.full-letter .sign{font-family:var(--script);font-size:1.8rem;color:var(--rose-deep);text-align:right}

.draft{margin-top:56px;padding-top:18px;border-top:1px dashed var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--ink-faint)}
.draft label{display:flex;gap:8px;align-items:center;cursor:pointer}
.draft input{accent-color:var(--rose-deep)}

.fade{animation:fade .5s ease both}
@keyframes fade{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.tcard{transition:none}}

@media (max-width:520px){
  .row{grid-template-columns:52px 1fr;gap:10px}
  .row .state{grid-column:2;justify-self:start}
  .card-draw{grid-template-columns:96px 1fr;gap:14px}
  .step{grid-template-columns:32px minmax(0,1fr);gap:4px 12px}
  .step .num{width:32px;height:32px;font-size:.9rem}
  .step::before{left:15px;top:38px}
}
</style>
</head>

<script>

 { date:"2026-10-06", kind:"Herzensdialog 3", title:"Die ungesagten Worte", gate:"Sprich aus, was dein Herz weiß",

  const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
  const W=640, H=190, pad=26;
  const sx=(W-2*pad)/(maxX-minX), sy=(H-2*pad-18)/(maxY-minY);
  const P=pts.map(([x,y])=>[pad+(x-minX)*sx, pad+(y-minY)*sy]);
  const len=[0]; for(let k=1;k<P.length;k++) len.push(len[k-1]+Math.hypot(P[k][0]-P[k-1][0],P[k][1]-P[k-1][1]));
  const total=len[len.length-1];
  const at = f => { const L=f*total; let k=len.findIndex(v=>v>=L); if(k<1)k=1; return P[k]; };
  const d="M"+P.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" L");
  // Markierungen auf dem mittleren Bogen (Venus hält inne und wendet sich)
  const nDaily = DAYS.filter(d=>!d.weekly).length;
  const frac = i => i < nDaily ? .1 + .66*i/(nDaily-1) : .81 + .15*(i-nDaily)/(DAYS.length-nDaily-1);
  const pos = DAYS.map((_,i)=>at(frac(i)));
  const near = i => pos.findIndex((q,j)=>j!==i && Math.hypot(q[0]-pos[i][0],q[1]-pos[i][1])<22);
  const marks = DAYS.map((day,i)=>{
    const [x,y]=pos[i]; const nb=near(i);
    const anchor = nb<0 ? "middle" : (pos[nb][0] > x ? "end" : "start");
    const tx = anchor==="middle" ? x : anchor==="end" ? x-3 : x+3;
    const cls=["dot", isDone(i)?"done":isOpen(i)?"open":"locked", day.date===TODAY?"today":""].join(" ");
    const label = shortD(day.date);
    const ty = y < H/2 ? y-13 : y+20;
    return `<g class="${cls}" data-day="${i}" tabindex="${isOpen(i)?0:-1}" role="button" aria-label="${esc(day.kind+': '+day.title)}${isOpen(i)?'':' – noch verschlossen'}">
      ${day.date===TODAY?`<circle class="halo" cx="${x}" cy="${y}" r="12"/>`:""}
      <circle class="m" cx="${x}" cy="${y}" r="6"/>
      <text x="${tx}" y="${ty}" style="text-anchor:${anchor}">${label}</text></g>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" aria-label="Die Kapitel auf der Schleife der rückläufigen Venus">
    <path class="path" d="${d}"/>${marks}</svg>`;
}

/* ---------- Ansichten ---------- */
function home(){
  const doneCount = DAYS.filter((_,i)=>isDone(i)).length;
  const started = TODAY >= DAYS[0].date;
  const until = Math.ceil((new Date(DAYS[0].date+"T00:00:00") - new Date(TODAY+"T00:00:00"))/864e5);
  return `
  <header class="bar">
    <button class="brand" data-go="home">Freya Astro Tarot</button>
    <button class="navbtn" data-go="letter">Mein Liebesbrief</button>
  </header>
  <section class="hero fade">
    <p class="eyebrow">Eine astrologische Reise zu Selbstliebe, innerem Wert und wahrhaftigen Beziehungen</p>
    <h1>Wenn Venus <em>rückwärts</em> tanzt</h1>
    <p class="script">Herzensdialoge</p>
    <p class="lead">Schreibe den Liebesbrief, den du immer gebraucht hast.</p>
    <div class="meta">
      <span>Deine Reise: <b>3. – 13. Oktober 2026</b></span>
      <span>Nachklang: <b>vier Wochenkapitel bis 14. November</b></span>
      <span>${started ? `<b>${doneCount} von ${DAYS.length}</b> Kapiteln gegangen` : `Noch <b>${until} Tage</b> bis zum Tor`}</span>
    </div>
  </section>
  <div class="loop">${loopSVG()}</div>
  <p class="loop-caption">Venus hält inne, wendet sich zurück – und zieht ihre Schleife, bis sie am 14. November wieder nach vorn geht. Mit jedem Kapitel öffnet sich ein neuer Punkt auf ihrem Weg.</p>

  <section class="note">
    <h2>So begleitet dich jedes Kapitel</h2>
    <p>Jeden Morgen öffnet sich ein neuer Herzensdialog – ein Gespräch zwischen zwei inneren Stimmen. Du spürst die Tagesenergie, kommst im Körper an, hörst deinem Herzen zu, drückst aus, was sich zeigt, und schreibst deinen Liebesbrief ein Stück weiter. Ein Mantra schließt den Tag.</p>
    <p class="movement">Erinnern · Erkennen · Aussprechen · Verkörpern · Abgrenzen · neu wählen · fühlen · empfangen · versprechen</p>
    <p>Danach klingt die Reise nach: Solange Venus rückläufig ist, öffnet sich jede Woche ein Kapitel – mit zwei Wendepunkten: dem Venus-Cazimi am 23. Oktober und der Umkehr der Venus am 14. November. Es führt zusammen, was du erlebt hast – zu <b>Selbstliebe</b>, <b>Verbindung zum Du</b>, <b>Abgrenzung</b> und <b>Gehalten sein</b>.</p>
  </section>

  ${group("Die elf Tage", "3. – 13. Oktober", DAYS.map((d,i)=>i).filter(i=>!DAYS[i].weekly))}
  ${group("Der Nachklang", "Vier Wochen bis Venus direkt wird", DAYS.map((d,i)=>i).filter(i=>DAYS[i].weekly))}
  ${draftToggle()}`;
}

function group(h, sub, idx){
  return `<section class="group"><div class="group-h"><h2>${h}</h2><span class="eyebrow">${sub}</span></div><div class="list">
    ${idx.map(i=>{ const d=DAYS[i];
      const st = isDone(i)?"done":isOpen(i)?"open":"locked";
      const stLabel = st==="done"?"gegangen":st==="open"?(d.date===TODAY?"heute offen":"offen"):"öffnet am "+shortD(d.date);
      return `<button class="row ${st==='locked'?'is-locked':''}" data-day="${i}" ${st==='locked'?'aria-disabled="true"':''}>
        <span class="date">${dayNum(d.date)}.<small>${weekday(d.date)} · ${MON[+d.date.slice(5,7)].slice(0,3)}</small></span>
        <span class="t"><span class="k">${esc(d.kind)}</span><span class="n">${esc(d.title)}</span><span class="e">${esc(d.energyShort)}</span></span>
        <span class="state ${st}">${stLabel}</span>
      </button>`;}).join("")}
  </div></section>`;
}

function waveBars(){ let s=""; for(let k=0;k<48;k++){ const h=4+Math.abs(Math.sin(k*.7)*Math.cos(k*.23))*18; s+=`<i style="height:${h.toFixed(0)}px"></i>`; } return s; }

function chapter(i){
  const d=DAYS[i], e=E(i);
  const mode = e.mode || "schreiben";
  const card = e.card!=null ? CARDS[e.card] : null;
  return `
  <header class="bar">
    <button class="navbtn" data-go="home">← Alle Kapitel</button>
    <button class="navbtn" data-go="letter">Mein Liebesbrief</button>
  </header>
  <section class="ch-head fade">
    <p class="eyebrow">${longD(d.date)} · ${esc(d.kind)} · ${esc(d.gate)}</p>
    <h1>${esc(d.title)}</h1>
    <p class="voices">Ein Dialog zwischen <b>${esc(d.voices[0])}</b> und <b>${esc(d.voices[1])}</b></p>
    <p class="feel">${esc(d.feel)}</p>
  </section>

  <section class="welcome">
    <p class="script">Schön, dass du da bist.</p>
    <p>${WELCOME}</p>
  </section>

  ${d.recap ? recapBlock(d) : ""}
  <article>
    <div class="step"><span class="num">1</span><div class="body">
      <h3>Tagesenergie wahrnehmen</h3>
      <div class="audio">
        <span class="play" aria-hidden="true"><svg viewBox="0 0 10 12"><path d="M0 0 L10 6 L0 12Z"/></svg></span>
        <span class="wave">${waveBars()}</span>
        <span class="lbl">Audio · folgt</span>
      </div>
      <p>${esc(d.astroText)}</p>
      <details class="astro"><summary>Die Konstellationen des Tages</summary>
        <ul>${d.astro.map(a=>`<li>${esc(a)}</li>`).join("")}</ul>
        <p class="fine">Westlich-tropische, geozentrische Astrologie. Die Deutungen beschreiben die symbolische Tagesqualität – dein persönliches Erleben hängt auch von deinem Geburtshoroskop ab.</p>
      </details>
    </div></div>

    <div class="step"><span class="num">2</span><div class="body">
      <h3>Im Körper ankommen</h3>
      <div class="practice"><span class="min">${esc(d.body.min)}</span><p>${esc(d.body.text)}</p></div>
    </div></div>

    <div class="step"><span class="num">3</span><div class="body">
      <h3>Dem Herzen zuhören</h3>
      <p class="sub">Deine Frage für heute</p>
      <p class="question">${esc(d.question)}</p>
      ${d.topicsLabel?`<p class="sub" style="margin-top:4px">${esc(d.topicsLabel)}</p>`:""}
      <div class="topics">${d.topics.map(t=>`<span>${esc(t)}</span>`).join("")}</div>
    </div></div>

    <div class="step"><span class="num">4</span><div class="body">
      <h3>Erlebtes ausdrücken</h3>
      <p>Ohne Anspruch auf Perfektion. Wähle, was sich heute stimmig anfühlt.</p>
      <div class="tabs" role="tablist">
        ${[["schreiben","Schreiben"],["karte","Karte ziehen"],["koerper","Malen · Bewegen · Sprechen"]].map(([k,l])=>`<button class="tab" role="tab" aria-selected="${mode===k}" data-mode="${k}">${l}</button>`).join("")}
      </div>
      ${mode==="schreiben" ? `
        <p class="prompt">${esc(d.impulse)}</p>
        <textarea id="expr-${i}" data-field="expr" placeholder="Schreib einfach los …">${esc(e.expr||"")}</textarea>
        <span class="saved" data-saved="expr"></span>`
      : mode==="karte" ? `
        <div class="card-draw">
          <button class="tcard" id="draw-${i}" aria-label="${card?'Andere Karte ziehen':'Karte ziehen'}">
            ${card ? `<span class="face"><small>DEINE KARTE</small>${esc(card[0])}</span>`
                   : `<span class="back"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="14"/><path d="M20 6 V34 M6 20 H34"/></svg></span>`}
          </button>
          <div class="body" style="gap:8px">
            ${card ? `<p class="prompt">${esc(card[1])}</p><p style="font-size:.85rem">Halte die Frage neben die heutige Tagesenergie. Was antwortet dein Herz?</p>`
                   : `<p>Atme einmal tief, denk an deine Frage für heute und tippe auf die Karte.</p>`}
          </div>
        </div>
        ${card ? `<textarea id="cardnote-${i}" data-field="cardnote" placeholder="Was die Karte in dir berührt …">${esc(e.cardnote||"")}</textarea><span class="saved" data-saved="cardnote"></span>`:""}`
      : `
        <p class="prompt">${esc(d.impulse)}</p>
        <p>Nimm ein Blatt und lass Farben sprechen. Oder bewege dich zu einem Lied, das dich heute berührt. Oder sprich deine Antwort als Sprachnachricht an dich selbst. Hinterher kannst du hier festhalten, was du bemerkt hast.</p>
        <textarea id="free-${i}" data-field="free" placeholder="Was habe ich bemerkt …">${esc(e.free||"")}</textarea>
        <span class="saved" data-saved="free"></span>`}
    </div></div>

    <div class="step"><span class="num">5</span><div class="body">
      <h3>Den Liebesbrief weiterführen</h3>
      <p>Jeden Tag entsteht ein neuer Abschnitt deines persönlichen Briefes.</p>
      ${letterPrompts(d).map((lp,k)=>{ const f=k?`letter${k}`:"letter"; return `<div class="letter-box">
        <span class="lp">${esc(lp)}</span>
        <textarea id="${f}-${i}" data-field="${f}" placeholder="… und hier schreibst du weiter.">${esc(e[f]||"")}</textarea>
        <span class="saved" data-saved="${f}"></span>
      </div>`;}).join("")}
      ${d.signature?`<div class="letter-box"><span class="lp">Unterschrift</span><p style="font-size:.88rem">Unterschreib deinen Brief mit Ort und Datum. So wird er zu einem bewussten inneren Vertrag.</p>
        <input class="sign-in" id="sign-${i}" data-field="sign" placeholder="Leipzig, 14. November 2026" value="${esc(e.sign||"")}">
        <span class="saved" data-saved="sign"></span></div>`:""}
    </div></div>

    <div class="step"><span class="num">6</span><div class="body">
      <h3>Die Energie integrieren</h3>
      <p class="mantra">${esc(d.mantra)}</p>
      ${d.ritual ? `<div class="practice"><span class="min">${esc(d.ritualLabel||"Ritual")}</span><ol class="ritual">${d.ritual.map(r=>`<li>${esc(r)}</li>`).join("")}</ol></div>`
                 : `<div class="practice"><span class="min">Abendpraxis</span><p>${esc(d.evening)}</p></div>`}
    </div></div>
  </article>

  <section class="closing">
    <p class="script">${CLOSING_HEAD}</p>
    <p>${CLOSING_TEXT}</p>
    <button class="donebtn ${e.done?'is-done':''}" id="done-${i}">${e.done?"Kapitel gegangen · wieder öffnen":"Dieses Kapitel abschließen"}</button>
  </section>

  <nav class="pager">
    ${i>0?`<button class="navbtn" data-day="${i-1}">← ${esc(DAYS[i-1].title)}</button>`:"<span></span>"}
    ${i<DAYS.length-1 ? (isOpen(i+1)?`<button class="navbtn" data-day="${i+1}">${esc(DAYS[i+1].title)} →</button>`:`<span class="navbtn" style="opacity:.6;cursor:default">Nächstes Kapitel öffnet am ${shortD(DAYS[i+1].date)}</span>`) : `<button class="navbtn" data-go="letter">Deinen Liebesbrief lesen →</button>`}
  </nav>
  ${draftToggle()}`;
}

function letterPrompts(d){ return d.letterParts || [d.letter]; }

function recapBlock(d){
  const items = d.recap.map(j=>{
    const e=S.entries[j]||{}; const own=(e.letter||e.expr||"").trim();
    return `<li><button class="rc-link" data-day="${j}">${shortD(DAYS[j].date)} · ${esc(DAYS[j].title)}</button>
      ${own ? `<p class="rc-own">„${esc(own.length>220?own.slice(0,220)+" …":own)}“</p>` : `<p class="rc-empty">${esc(DAYS[j].feel)}</p>`}</li>`;
  }).join("");
  return `<section class="recap"><p class="eyebrow">Rückschau · ${esc(d.theme)}</p>
    <p>Bevor du beginnst, lies noch einmal, was du in diesen Kapiteln erlebt und geschrieben hast.</p>
    <ul>${items}</ul></section>`;
}

function letterView(){
  const parts = [];
  DAYS.forEach((d,i)=>{ const e=S.entries[i]||{};
    letterPrompts(d).forEach((lp,k)=>{ const t=(e[k?`letter${k}`:"letter"]||"").trim(); if(t) parts.push({d,i,lp,t,first:!parts.some(x=>x.i===i)}); });
  });
  const any = parts.length>0;
  const signIdx = DAYS.findIndex(d=>d.signature);
  const sign = signIdx>=0 && S.entries[signIdx] ? (S.entries[signIdx].sign||"").trim() : "";
  return `
  <header class="bar">
    <button class="navbtn" data-go="home">← Alle Kapitel</button>
  </header>
  <section class="ch-head fade">
    <p class="eyebrow">Dein Brief · wächst mit jedem Kapitel</p>
    <h1>Der Liebesbrief, den du immer gebraucht hast</h1>
  </section>
  <div class="full-letter">
    <p class="salute">Meine Liebe,</p>
    ${any ? parts.map(p=>`<div class="part">${p.first?`<span class="from">${longD(p.d.date)} · ${esc(p.d.title)}</span>`:""}<p><em>${esc(p.lp.replace(/ …$/," "))}</em>${esc(p.t)}</p></div>`).join("")
          : `<p class="empty">Noch ist dieser Brief leer. Mit jedem Herzensdialog schreibst du einen neuen Abschnitt – hier fügen sich alle zusammen, damit du ihn am 13. Oktober laut lesen und bis zum 14. November weiterschreiben kannst.</p>`}
    <p class="sign">in Liebe, ich</p>
    ${sign?`<p class="sign-place">${esc(sign)}</p>`:""}
  </div>
  ${draftToggle()}`;
}

function draftToggle(){
  return `<div class="draft"><label><input type="checkbox" id="preview" ${S.preview?"checked":""}> Entwurfsansicht: alle Kapitel schon jetzt öffnen</label><span>· Heute (Berlin): ${TODAY.split("-").reverse().join(".")}</span></div>`;
}

/* ---------- Rendern & Ereignisse ---------- */
function render(){
  if(view.name==="day" && !isOpen(view.i)) view={name:"home"};
  app.innerHTML = view.name==="day" ? chapter(view.i) : view.name==="letter" ? letterView() : home();
}

app.addEventListener("click", ev=>{
  const t = ev.target.closest("[data-go],[data-day],[data-mode],.tcard,.donebtn");
  if(!t) return;
  if(t.dataset.go){ go({name:t.dataset.go}); return; }
  if(t.dataset.mode){ E(view.i).mode=t.dataset.mode; save(); render(); return; }
  if(t.classList.contains("tcard")){ const e=E(view.i); let n; do{ n=Math.floor(Math.random()*CARDS.length);}while(n===e.card && CARDS.length>1); e.card=n; save(); render(); return; }
  if(t.classList.contains("donebtn")){ const e=E(view.i); e.done=!e.done; save(); render(); return; }
  if(t.dataset.day!=null){ const i=+t.dataset.day; if(isOpen(i)) go({name:"day",i}); }
});
app.addEventListener("keydown", ev=>{
  const g = ev.target.closest && ev.target.closest("g.dot");
  if(g && (ev.key==="Enter"||ev.key===" ")){ ev.preventDefault(); const i=+g.dataset.day; if(isOpen(i)) go({name:"day",i}); }
});
let timer;
app.addEventListener("input", ev=>{
  const f = ev.target.dataset && ev.target.dataset.field;
  if(!f || view.name!=="day") return;
  E(view.i)[f]=ev.target.value;
  clearTimeout(timer);
  timer=setTimeout(()=>{ save(); const s=app.querySelector(`[data-saved="${f}"]`); if(s){ s.textContent="Gespeichert – nur auf diesem Gerät."; } },500);
});
app.addEventListener("change", ev=>{
  if(ev.target.id==="preview"){ S.preview=ev.target.checked; save(); render(); }
});

render();
</script>
